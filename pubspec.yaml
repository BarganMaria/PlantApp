name: plant_identification_app
version: 1.0.0+1
description: Plant Identification App UI
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_weather_bg_null_safety: ^1.0.0
  flutter_dotenv: ^5.1.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  image: ^4.1.7
  tflite_flutter: ^0.12.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/plants/
    - assets/tflite_model/model.tflite
    - assets/tflite_model/labels.txt
    - .env
